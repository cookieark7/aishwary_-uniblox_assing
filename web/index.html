<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uniblox Store</title>
    <meta
      name="description"
      content="Reviewer UI for the Uniblox store API: carts, checkout, coupons and live concurrency checks."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/base.css" />
    <link rel="stylesheet" href="/styles/components.css" />
    <link rel="stylesheet" href="/styles/layout.css" />
    <link rel="stylesheet" href="/styles/features.css" />
  </head>
  <body>
    <div class="app">
      <nav id="sidebar" class="sidebar" aria-label="Main"></nav>
      <main class="main">
        <div id="view" class="page"></div>
      </main>
      <aside id="inspector" class="inspector" aria-label="Network inspector"></aside>
    </div>
    <noscript>This reviewer UI needs JavaScript. The API itself works without it.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
